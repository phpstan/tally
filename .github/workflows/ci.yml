# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "CI"

on:
  pull_request:
  push:
    branches:
      - "1.x"
      - "release/1.x"

concurrency:
  group: ci-${{ github.head_ref || github.run_id }} # will be canceled on subsequent pushes in pull requests but not branches
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: "Lint"
    runs-on: "ubuntu-latest"

    strategy:
      matrix:
        php-version:
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
          - "8.6"

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install PHP"
        uses: "shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962" # v2
        with:
          coverage: "none"
          php-version: "${{ matrix.php-version }}"

      - name: "Validate Composer"
        run: "composer validate"

      - name: "Without Infection, which needs PHP 8.3"
        if: matrix.php-version == '8.2'
        run: "composer remove --dev --no-update infection/infection"

      - name: "Install dependencies"
        run: "composer install --no-interaction --no-progress"

      - name: "Lint"
        run: "make lint"

  coding-standard:
    name: "Coding Standard"
    runs-on: "ubuntu-latest"

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Checkout build-cs"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: "phpstan/build-cs"
          path: "build-cs"
          ref: "2.x"

      - name: "Install PHP"
        uses: "shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962" # v2
        with:
          coverage: "none"
          php-version: "8.5"

      - name: "Validate Composer"
        run: "composer validate"

      - name: "Install dependencies"
        run: "composer install --no-interaction --no-progress"

      - name: "Install build-cs dependencies"
        working-directory: "build-cs"
        run: "composer install --no-interaction --no-progress"

      - name: "Lint"
        run: "make lint"

      - name: "Coding Standard"
        run: "make cs"

  tests:
    name: "Tests"
    runs-on: "ubuntu-latest"

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
          - "8.6"

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install PHP"
        uses: "shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962" # v2
        with:
          coverage: "none"
          php-version: "${{ matrix.php-version }}"
          extensions: posix
          # builds the recording build of tally_hooks for the tests
          tools: phpize, php-config

      - name: "Without Infection, which needs PHP 8.3"
        if: matrix.php-version == '8.2'
        run: "composer remove --dev --no-update infection/infection"

      - name: "Install dependencies"
        run: "composer install --no-interaction --no-progress"

      - name: "Tests"
        run: "make tests"

  static-analysis:
    name: "PHPStan"
    runs-on: "ubuntu-latest"

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.5"
          - "8.6"

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install PHP"
        uses: "shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962" # v2
        with:
          coverage: "none"
          php-version: "${{ matrix.php-version }}"
          extensions: posix

      - name: "Install dependencies"
        run: "composer install --no-interaction --no-progress"

      - name: "PHPStan"
        run: "make phpstan"

  coverage:
    name: "Code Coverage"
    runs-on: "ubuntu-latest"

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install PHP"
        uses: "shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962" # v2
        with:
          coverage: "pcov"
          php-version: "8.5"
          extensions: posix
          # builds the recording build of tally_hooks for the tests
          tools: phpize, php-config

      - name: "Install dependencies"
        run: "composer install --no-interaction --no-progress"

      - name: "Code coverage"
        run: "make coverage"

  mutation-testing:
    name: "Mutation Testing"
    runs-on: "ubuntu-latest"
    needs: ["tests", "static-analysis"]

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install PHP"
        uses: "shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962" # v2
        with:
          coverage: "pcov"
          php-version: "8.5"
          extensions: posix
          # builds the recording build of tally_hooks for the tests
          tools: phpize, php-config

      - name: "Install dependencies"
        run: "composer install --no-interaction --no-progress"

      - name: "Infection on the changed lines"
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "$GITHUB_BASE_REF"
          make infection INFECTION_ARGS="--git-diff-base=origin/$GITHUB_BASE_REF --git-diff-lines --ignore-msi-with-no-mutations --min-msi=100 --min-covered-msi=100 --logger-github"

      - name: "Infection on the whole codebase"
        if: github.event_name != 'pull_request'
        run: "make infection INFECTION_ARGS=--logger-github"

  codspeed:
    name: "CodSpeed's Valgrind (${{ matrix.runner }})"
    # release/1.x has the builds committed
    if: ${{ !startsWith(github.ref_name, 'release/') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    strategy:
      matrix:
        runner:
          - "ubuntu-24.04"
          - "ubuntu-24.04-arm"

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Key of the build"
        id: key
        run: echo "key=codspeed-$(build/build-codspeed.sh --print-key)" >> "$GITHUB_OUTPUT"

      - name: "Restore the build"
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: codspeed
          key: ${{ steps.key.outputs.key }}

      - name: "Build"
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends autoconf automake
          build/build-codspeed.sh

      - name: "Upload the build"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codspeed-${{ matrix.runner }}
          path: codspeed
          if-no-files-found: error

  tally-hooks:
    name: "tally_hooks (${{ matrix.runner }})"
    # release/1.x has the builds committed
    if: ${{ !startsWith(github.ref_name, 'release/') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    strategy:
      matrix:
        runner:
          - "ubuntu-24.04"
          - "ubuntu-24.04-arm"

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Restore the builds"
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: codspeed
          key: tally-hooks-${{ runner.arch }}-8.2-8.6-${{ hashFiles('ext/tally_hooks/*', 'build/build-tally-hooks.sh') }}

      # One build per minor version, thread safe or not, in the official images: an extension
      # loads into any build of PHP with the same API version and thread safety.
      - name: "Build"
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          output="codspeed/linux-$(uname -m)"
          for version in 8.2 8.3 8.4 8.5 8.6; do
            for variant in cli zts; do
              image="php:$version-$variant"
              # PHP 8.6 has only release candidates so far
              if [ "$version" = 8.6 ]; then
                image="php:8.6-rc-$variant"
              fi
              suffix=""
              if [ "$variant" = zts ]; then
                suffix="-zts"
              fi
              docker run --rm -v "$PWD:/tally" -w /tally "$image" bash -c \
                'apt-get update -qq && apt-get install -y -qq --no-install-recommends $PHPIZE_DEPS >/dev/null && build/build-tally-hooks.sh "$1" && chown "$2" "$1"' \
                _ "$output/tally_hooks-$version$suffix.so" "$(id -u):$(id -g)"
            done
          done
          ls -l "$output"

      - name: "Upload the builds"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tally-hooks-${{ matrix.runner }}
          path: codspeed
          if-no-files-found: error

  benchmarks:
    name: "Benchmarks"
    needs: ["codspeed", "tally-hooks"]
    # runs on release/1.x too, with the committed builds, when the builds are skipped
    if: ${{ !cancelled() && !failure() }}
    # Pinned because the counts depend on the PHP build and the system libraries
    runs-on: "ubuntu-24.04"
    timeout-minutes: 30

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install PHP"
        uses: "shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962" # v2
        with:
          coverage: "none"
          php-version: "8.5"
          extensions: posix

      - name: "Install dependencies"
        run: "composer install --no-interaction --no-progress"

      - name: "Download CodSpeed's Valgrind"
        if: ${{ !startsWith(github.ref_name, 'release/') }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: codspeed-ubuntu-24.04
          path: codspeed

      - name: "Download tally_hooks"
        if: ${{ !startsWith(github.ref_name, 'release/') }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tally-hooks-ubuntu-24.04
          path: codspeed

      - name: "Benchmarks"
        run: "php bin/tally run --output=tmp/tally-results"

      - name: "Examples"
        if: always()
        run: "php bin/tally run --output=tmp/tally-examples examples"

      - name: "Upload results"
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tally-results
          path: tmp/tally-results
          if-no-files-found: ignore

      - name: "Upload results of the examples"
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tally-examples
          path: tmp/tally-examples
          if-no-files-found: ignore

  release-tree:
    name: "Release tree (${{ matrix.runner }}, PHP ${{ matrix.php-version }})"
    # Checks the tree release/1.x gets from this commit the way a project installs it, on each platform
    needs: ["codspeed", "tally-hooks"]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        runner:
          - "ubuntu-24.04"
          - "ubuntu-24.04-arm"
        # the oldest and the newest build of tally_hooks
        php-version:
          - "8.2"
          - "8.5"

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install PHP"
        uses: "shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962" # v2
        with:
          coverage: "none"
          php-version: "${{ matrix.php-version }}"
          extensions: posix

      - name: "Download CodSpeed's Valgrind"
        if: ${{ !startsWith(github.ref_name, 'release/') }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: codspeed-*
          path: codspeed
          merge-multiple: true

      - name: "Download tally_hooks"
        if: ${{ !startsWith(github.ref_name, 'release/') }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tally-hooks-*
          path: codspeed
          merge-multiple: true

      - name: "Build the release tree"
        if: ${{ !startsWith(github.ref_name, 'release/') }}
        run: |
          git config user.name "phpstan-bot"
          git config user.email "ondrej+phpstanbot@mirtes.cz"
          build/build-release.sh --commit

      - name: "Check the release tree"
        run: build/check-release.sh HEAD

  release-branch:
    name: "Push release/1.x"
    needs: ["release-tree", "tests", "static-analysis", "benchmarks"]
    if: ${{ github.event_name == 'push' && github.ref_name == '1.x' }}
    runs-on: "ubuntu-latest"
    timeout-minutes: 10

    concurrency:
      group: release-branch
      cancel-in-progress: true

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # a token that may bypass the branch rules, and whose push runs CI on release/1.x
          token: ${{ secrets.PHPSTAN_BOT_TOKEN }}

      - name: "Download CodSpeed's Valgrind"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: codspeed-*
          path: codspeed
          merge-multiple: true

      - name: "Download tally_hooks"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tally-hooks-*
          path: codspeed
          merge-multiple: true

      - name: "Build the release tree"
        run: |
          git config user.name "phpstan-bot"
          git config user.email "ondrej+phpstanbot@mirtes.cz"
          build/build-release.sh --commit

      # Each push replaces the branch; the tags keep the commits they were made on
      - name: "Push"
        run: git push --force origin "HEAD:refs/heads/release/1.x"
